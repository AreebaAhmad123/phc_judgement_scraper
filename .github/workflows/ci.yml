name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Tests mock every external call (Groq, Weaviate, S3, the
          # external judgment API, Google Drive) - these are placeholder
          # values so config.py's import-time reads don't fail, not real
          # credentials. Nothing in CI ever touches a live service.
          REQUIRE_API_KEY: "true"
          API_KEY: "ci-placeholder-key"
          LLM_API_KEY: "ci-placeholder-key"
          EXTERNAL_JUDGMENT_API_KEY: "ci-placeholder-key"
          AWS_ACCESS_KEY_ID: "ci-placeholder"
          AWS_SECRET_ACCESS_KEY: "ci-placeholder"
          S3_BUCKET_NAME: "ci-placeholder-bucket"
          CONTACT_EMAIL: "ci@example.com"
          SKIP_S3_CHECK: "1"
        run: pytest tests/ -v

      - name: Byte-compile check (whole repo)
        run: python -m compileall -q phc_scraper api eval
