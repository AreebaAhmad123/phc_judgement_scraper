# Full local stack: Weaviate + the API service, built from the
# Dockerfile in this repo. `docker-compose.weaviate.yml` still works
# standalone if you only want Weaviate (e.g. running the API/scraper
# outside Docker during development).
#
#   docker compose up --build          # API + Weaviate
#   docker compose run --rm app python -m phc_scraper.cli
#   docker compose run --rm app python -m phc_scraper.scheduler
version: "3.4"
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
      - ./pdfs:/app/pdfs
      - ./markdown:/app/markdown
      - ./metadata:/app/metadata

  app:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's WEAVIATE_URL so the app reaches Weaviate via
      # the Docker network's service name rather than localhost.
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      - weaviate
    volumes:
      - ./data:/app/data
      - ./downloaded_pdfs:/app/downloaded_pdfs

volumes:
  weaviate_data:
